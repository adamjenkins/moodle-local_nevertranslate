name: local_nevertranslate
summary: 'A Moodle local plugin that stops browsers, browser extensions and translation services from automatically translating site pages.'
description: |
  Adds every page-level opt-out that translators are known to honour to every
  themed Moodle page: translate="no" and the notranslate class on html and body,
  the google notranslate meta tag (the only markup that stops Chrome desktop and
  Android from offering to translate), robots notranslate and X-Robots-Tag, plus
  a small guard script that restores the markers if they are removed. An opt-in
  Revert option reloads a page that has been translated anyway. Each technique
  can be switched on or off by the site administrator. No markup can hide the
  browser's own Translate menu item; browser policies are needed for that.
labels:
  # Required disclosure labels — pick all that apply (RFC §4.7):
